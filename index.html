<script>
class SoundController {
    constructor() { this.ctx = null; }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playPop(pitchModifier = 1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';

        const baseFreq = 300 * Math.min(pitchModifier, 2.5);
        osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, this.ctx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
    }

    playCoin() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';

        osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
    }

    playFanfare() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.09);
            osc.stop(this.ctx.currentTime + idx * 0.09 + 0.25);
        });
    }
}

// Generate balanced parameters for all 50 levels
function getLevelConfig(num) {
    const target = 300 + (num - 1) * 200; // L1: 300, L2: 500, L3: 700...
    const moves = Math.max(8, 10 + Math.floor(num / 3)); // L1: 10, L2: 10, etc.
    const bubbleCount = Math.min(22, 14 + Math.floor(num / 4));
    return { target, moves, bubbleCount };
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let bubbles = [];

function resizeCanvas() {
    const app = document.getElementById('app-window');
    canvas.width = app.clientWidth;
    canvas.height = app.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

const GEM_TYPES = [
    { primary: '#f43f5e', secondary: '#9f1239' }, // Ruby
    { primary: '#38bdf8', secondary: '#0369a1' }, // Sapphire
    { primary: '#c084fc', secondary: '#6b21a8' }, // Amethyst
    { primary: '#34d399', secondary: '#065f46' }, // Emerald
    { primary: '#fbbf24', secondary: '#92400e' }  // Topaz
];

class Bubble {
    constructor(x, y, r) {
        this.x = x;
        this.y = y;
        this.radius = r;
        this.maxRadius = 58;
        this.isGrowing = false;

        const angle = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * 0.6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.type = GEM_TYPES[Math.floor(Math.random() * GEM_TYPES.length)];
    }

    update() {
        if (this.isGrowing) {
            if (this.radius < this.maxRadius) {
                this.radius += 0.9;
            }
        } else if (freezeTimer <= 0) {
            this.x += this.vx;
            this.y += this.vy;

            const padTop = 75;
            const padBottom = 95;
            if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
            if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
            if (this.y - this.radius < padTop) { this.y = padTop + this.radius; this.vy *= -1; }
            if (this.y + this.radius > canvas.height - padBottom) { this.y = canvas.height - padBottom - this.radius; this.vy *= -1; }
        }
    }

    draw() {
        ctx.save();
        ctx.shadowColor = this.type.primary;
        ctx.shadowBlur = this.isGrowing ? 18 : 6;

        const grad = ctx.createRadialGradient(
            this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
            this.x, this.y, this.radius
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, this.type.primary);
        grad.addColorStop(0.85, this.type.secondary);
        grad.addColorStop(1, '#020617');

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Specular highlight
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fill();

        if (this.isGrowing) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();
        }

        ctx.restore();
    }
}

function spawnBoard(count = 14) {
    bubbles = [];
    for (let i = 0; i < count; i++) {
        const r = 18 + Math.random() * 8;
        const x = r + Math.random() * (canvas.width - r * 2);
        const y = 85 + Math.random() * (canvas.height - 185);
        bubbles.push(new Bubble(x, y, r));
    }
}

function popBubble(targetBubble, combo = 1) {
    const index = bubbles.indexOf(targetBubble);
    if (index === -1) return;

    bubbles.splice(index, 1);
    sounds.playPop(combo);

    score += 30 * combo;
    coins += 1;
    updateUI();

    // Spawn Particles
    for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
            x: targetBubble.x,
            y: targetBubble.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 2.5,
            color: targetBubble.type.primary,
            alpha: 1
        });
    }

    // Expand Shockwave Burst
    const shockRadius = targetBubble.radius * 1.7;
    shockwaves.push({
        x: targetBubble.x,
        y: targetBubble.y,
        radius: targetBubble.radius,
        maxRadius: shockRadius,
        color: targetBubble.type.primary,
        alpha: 0.85
    });

    // Cascading Chain Reaction
    setTimeout(() => {
        for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            const dist = Math.hypot(targetBubble.x - b.x, targetBubble.y - b.y);
            if (dist <= shockRadius + b.radius) {
                popBubble(b, combo + 1);
            }
        }
    }, 65);
}

function handlePointerDown(e) {
    if (levelEndingState) return;
    sounds.init();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = clientX - rect.left;
    const y = clientY - rect.top;

    for (let b of bubbles) {
        if (Math.hypot(x - b.x, y - b.y) <= b.radius + 12) {
            activeHoldBubble = b;
            b.isGrowing = false;
            break;
        }
    }
}

function handlePointerUp() {
    if (activeHoldBubble && !levelEndingState) {
        activeHoldBubble.isGrowing = false;
        if (gameMode === 'campaign') {
            movesLeft--;
            updateUI();
        }
        popBubble(activeHoldBubble, 1);
        activeHoldBubble = null;

        if (gameMode === 'campaign') {
            setTimeout(checkLevelOutcome, 300);
        }
    }
}

canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('mouseup', handlePointerUp);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); handlePointerUp(); });

function mainLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (freezeTimer > 0) freezeTimer -= 1/60;

    // Auto-replenish in Arcade mode OR if board clears in Campaign
    if (bubbles.length === 0) {
        if (gameMode === 'arcade') {
            spawnBoard(15);
        } else if (gameMode === 'campaign' && !levelEndingState) {
            spawnBoard(getLevelConfig(currentLevelNum).bubbleCount);
        }
    }

    bubbles.forEach(b => { b.update(); b.draw(); });

    shockwaves.forEach((sw, idx) => {
        sw.radius += (sw.maxRadius - sw.radius) * 0.22;
        sw.alpha -= 0.04;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.stroke();
        ctx.restore();
        if (sw.alpha <= 0) shockwaves.splice(idx, 1);
    });

    particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fill();
        ctx.restore();
        if (p.alpha <= 0) particles.splice(idx, 1);
    });

    requestAnimationFrame(mainLoop);
}
mainLoop();

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('hud-layer').style.display = 'none';
    document.getElementById('booster-dock').style.display = 'none';

    if (id) {
        document.getElementById(id).classList.add('active');
    }
}

function updateUI() {
    document.getElementById('menu-coin-count').innerText = coins;
    document.getElementById('levels-coin-count').innerText = coins;
    document.getElementById('shop-coin-count').innerText = coins;
    document.getElementById('hud-score').innerText = score;

    document.getElementById('count-bomb').innerText = inventory.bomb;
    document.getElementById('count-freeze').innerText = inventory.freeze;
    document.getElementById('count-zap').innerText = inventory.zap;

    if (gameMode === 'campaign') {
        document.getElementById('hud-level-num').innerText = currentLevelNum;
        document.getElementById('hud-score-req').innerText = `${score}/${targetScore}`;
        document.getElementById('hud-moves').innerText = movesLeft;
    } else {
        document.getElementById('hud-level-num').innerText = '∞';
        document.getElementById('hud-score-req').innerText = score;
        document.getElementById('hud-moves').innerText = '∞';
    }

    localStorage.setItem('bs_coins', coins);
    localStorage.setItem('bs_inventory', JSON.stringify(inventory));
}

function startCampaignLevel(levelNum) {
    gameMode = 'campaign';
    currentLevelNum = levelNum;
    levelEndingState = false;

    const config = getLevelConfig(levelNum);
    score = 0;
    movesLeft = config.moves;
    targetScore = config.target;

    showScreen(null);
    document.getElementById('hud-layer').style.display = 'flex';
    document.getElementById('booster-dock').style.display = 'flex';

    spawnBoard(config.bubbleCount);
    updateUI();
}

function checkLevelOutcome() {
    if (levelEndingState) return;

    if (score >= targetScore) {
        levelEndingState = true;
        sounds.playFanfare();

        const earnedCoins = 50 + currentLevelNum * 10;
        coins += earnedCoins;

        if (currentLevelNum === unlockedLevel && unlockedLevel < 50) {
            unlockedLevel++;
            localStorage.setItem('bs_unlocked', unlockedLevel);
        }

        const calculatedStars = score >= targetScore * 1.5 ? 3 : (score >= targetScore * 1.2 ? 2 : 1);
        levelStars[currentLevelNum] = Math.max(levelStars[currentLevelNum] || 0, calculatedStars);
        localStorage.setItem('bs_stars', JSON.stringify(levelStars));

        document.getElementById('dialog-stars').innerText = '⭐'.repeat(calculatedStars);
        document.getElementById('dialog-title').innerText = 'LEVEL COMPLETED!';
        document.getElementById('dialog-title').style.color = '#34d399';
        document.getElementById('dialog-desc').innerText = `Scored ${score} pts! Earned +${earnedCoins} 🪙`;

        document.getElementById('btn-dialog-next').style.display = currentLevelNum < 50 ? 'block' : 'none';
        document.getElementById('btn-dialog-retry').style.display = 'none';

        showScreen('screen-dialog');
    } else if (movesLeft <= 0) {
        levelEndingState = true;
        document.getElementById('dialog-stars').innerText = '💔';
        document.getElementById('dialog-title').innerText = 'OUT OF MOVES!';
        document.getElementById('dialog-title').style.color = '#f43f5e';
        document.getElementById('dialog-desc').innerText = `Target: ${targetScore} | Your Score: ${score}`;

        document.getElementById('btn-dialog-next').style.display = 'none';
        document.getElementById('btn-dialog-retry').style.display = 'block';

        showScreen('screen-dialog');
    }
}

// Menu Click Bindings
document.getElementById('btn-menu-campaign').onclick = () => {
    renderLevelGrid();
    showScreen('screen-levels');
};

document.getElementById('btn-menu-arcade').onclick = () => {
    gameMode = 'arcade';
    score = 0;
    levelEndingState = false;
    showScreen(null);
    document.getElementById('hud-layer').style.display = 'flex';
    document.getElementById('booster-dock').style.display = 'flex';
    spawnBoard(15);
    updateUI();
};

document.getElementById('btn-menu-shop').onclick = () => showScreen('screen-shop');
document.getElementById('btn-back-levels').onclick = () => showScreen('screen-main');
document.getElementById('btn-back-shop').onclick = () => showScreen('screen-main');

document.getElementById('btn-pause').onclick = () => {
    document.getElementById('dialog-stars').innerText = '⏸️';
    document.getElementById('dialog-title').innerText = 'GAME PAUSED';
    document.getElementById('dialog-title').style.color = '#38bdf8';
    document.getElementById('dialog-desc').innerText = 'Take a short break!';
    document.getElementById('btn-dialog-next').style.display = 'none';
    document.getElementById('btn-dialog-retry').style.display = 'none';
    showScreen('screen-dialog');
};

document.getElementById('btn-dialog-next').onclick = () => {
    if (currentLevelNum < 50) {
        startCampaignLevel(currentLevelNum + 1);
    }
};

document.getElementById('btn-dialog-retry').onclick = () => {
    startCampaignLevel(currentLevelNum);
};

document.getElementById('btn-dialog-quit').onclick = () => {
    showScreen('screen-main');
};

// Render 50 Level Grid
function renderLevelGrid() {
    const grid = document.getElementById('levels-container');
    grid.innerHTML = '';

    for (let i = 1; i <= 50; i++) {
        const node = document.createElement('div');
        const isUnlocked = i <= unlockedLevel;
        const stars = levelStars[i] || 0;

        node.className = `level-node ${isUnlocked ? 'unlocked' : 'locked'} ${stars > 0 ? 'completed' : ''}`;
        node.innerHTML = `
            <div>${i}</div>
            ${stars > 0 ? `<div class="star-row">${'★'.repeat(stars)}</div>` : ''}
        `;

        if (isUnlocked) {
            node.onclick = () => startCampaignLevel(i);
        }

        grid.appendChild(node);
    }
}

function buyItem(type, price) {
    sounds.init();
    if (coins >= price) {
        coins -= price;
        inventory[type] = (inventory[type] || 0) + 1;
        sounds.playCoin();
        updateUI();
    } else {
        alert("Not enough coins!");
    }
}

function useBooster(type) {
    if (inventory[type] > 0) {
        if (type === 'freeze') {
            inventory.freeze--;
            freezeTimer = 6;
        } else if (type === 'bomb' && bubbles.length > 0) {
            inventory.bomb--;
            const centerBubble = bubbles[Math.floor(bubbles.length / 2)];
            centerBubble.radius = 55;
            popBubble(centerBubble, 2);
        } else if (type === 'zap' && bubbles.length > 0) {
            inventory.zap--;
            popBubble(bubbles[0], 2);
        }
        updateUI();
        if (gameMode === 'campaign') {
            setTimeout(checkLevelOutcome, 300);
        }
    }
}

document.getElementById('btn-menu-daily').onclick = () => {
    sounds.init();
    const lastClaim = parseInt(localStorage.getItem('bs_last_daily')) || 0;
    const now = Date.now();
    const cooldown = 24 * 60 * 60 * 1000;

    if (now - lastClaim >= cooldown) {
        coins += 150;
        localStorage.setItem('bs_last_daily', now);
        sounds.playCoin();
        alert("🎉 Daily Reward Claimed: +150 Coins!");
        updateUI();
        updateDailyStatus();
    } else {
        const remaining = cooldown - (now - lastClaim);
        const hrs = Math.floor(remaining / (1000 * 60 * 60));
        const mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        alert(`⌛ Cooldown active! Return in ${hrs}h ${mins}m`);
    }
};

function updateDailyStatus() {
    const lastClaim = parseInt(localStorage.getItem('bs_last_daily')) || 0;
    const now = Date.now();
    const cooldown = 24 * 60 * 60 * 1000;

    if (now - lastClaim < cooldown) {
        const remaining = cooldown - (now - lastClaim);
        const hrs = Math.floor(remaining / (1000 * 60 * 60));
        document.getElementById('daily-status').innerText = `(${hrs}h left)`;
    } else {
        document.getElementById('daily-status').innerText = `(READY!)`;
    }
}

updateUI();
updateDailyStatus();
</script>
